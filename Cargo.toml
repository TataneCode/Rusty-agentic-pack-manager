[package]
name = "rusty_agentic_pack_manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A TUI to manage agentic packs (skills, agents, commands) for AI CLIs"
repository = "https://github.com/TataneCode/Rusty-agentic-pack-manager"

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.29"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization (pack.toml manifests)
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Mockable repository boundaries (automock attribute is part of the trait
# definitions)
mockall = "0.14"
# Syntax highlighting for the pack viewer (.md, .js, .toml)
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rapm"
path = "src/main.rs"

# RPM packaging: binary + LICENSE. The packs/ files are added dynamically
# by CI (cargo-generate-rpm does not support directory assets), see
# .github/workflows/ci.yml.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rapm", dest = "/usr/bin/rapm", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/rapm/LICENSE", mode = "644", doc = true },
]

# DEB packaging: same layout
[package.metadata.deb]
maintainer = "TataneCode"
copyright = "2026, TataneCode"
extended-description = "TUI to manage agentic packs (skills, agents, commands) for AI CLIs."
depends = "$auto"
assets = [
    ["target/release/rapm", "usr/bin/", "755"],
    ["LICENSE", "usr/share/doc/rusty-agentic-pack-manager/LICENSE", "644"],
]
