# CLI profile: OpenCode (shipped default). Override by placing an
# opencode.toml in the user CLI library ($XDG_DATA_HOME/rapm/clis).
[cli]
name = "opencode"
label = "OpenCode"

[defaults]
skill     = ".opencode/skills/{name}/SKILL.md"
skill_dir = ".opencode/skills/{name}/"
agent     = ".opencode/agent/{name}.md"
command   = ".opencode/command/{name}.md"
