name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-archives:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: rapm
            archive: rapm-linux-x64.tar.gz
          - os: windows-latest
            bin: rapm.exe
            archive: rapm-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Stage dist (binary + packs + docs)
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" dist/
          cp -r packs dist/packs
          cp LICENSE README.md MANUAL.md dist/
      - name: Create tar.gz (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C dist .
      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build-archives
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rapm-*
          path: dist
          merge-multiple: true
      - name: Check tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=${tag} cargo=${version}"
          if [ -z "$version" ] || [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version (${version})"
            exit 1
          fi
      - name: Create release with archives and generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/rapm-linux-x64.tar.gz dist/rapm-windows-x64.zip
