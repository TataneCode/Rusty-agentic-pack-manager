name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux-packages:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: RPM
        run: |
          cargo install cargo-generate-rpm
          python3 packaging/expand_rpm_assets.py
          cargo generate-rpm
      - name: DEB
        run: |
          cargo install cargo-deb
          cargo deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/**/*.rpm
            target/debian/*.deb

  windows-7z:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Build 7z artifact (binary + packs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/rapm.exe dist/
          Copy-Item -Recurse packs dist/packs
          7z a rapm-windows-x64.7z ./dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: rapm-windows-7z
          path: rapm-windows-x64.7z
