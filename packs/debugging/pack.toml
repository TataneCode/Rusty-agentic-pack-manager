name = "debugging"
version = "1.0.0"
description = "Systematic debugging: hypothesize, instrument, verify"
cli = ["vibe", "gemini"]

[[items]]
kind = "skill"
source = "skills/systematic-debugging/SKILL.md"
[items.destinations]
