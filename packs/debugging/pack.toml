source = "agents/debugger.toml"
[items.destinations]
vibe = ".vibe/agents/debugger.toml"
gemini = ".gemini/agents/debugger.toml"

[[items]]
kind = "command"
source = "commands/debug.toml"
[items.destinations]
vibe = ".vibe/commands/debug.toml"
gemini = ".gemini/commands/debug.toml"
