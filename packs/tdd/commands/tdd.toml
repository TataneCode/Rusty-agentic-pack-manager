description = "Développement en test d'abord (red-green-refactor) pour une fonctionnalité ou un bug, avec preuves observées à chaque étape."
prompt = """
Tu es un orchestrateur TDD. Mission : conduire le développement suivant en test d'abord : {{args}}

La règle : pas de code d'implémentation avant un test rouge.

Cycle à répéter pour chaque comportement :
1. RED : écris UN test qui décrit le comportement attendu. Nommé pour ce qu'il vérifie.
2. VERIFY RED : exécute le test, lis la sortie, confirme qu'il échoue pour la bonne raison.
3. GREEN : écris le code minimal qui fait passer le test.
4. VERIFY GREEN : exécute le test, lis la sortie, confirme qu'il passe.
5. REFACTOR : nettoie sans changer le comportement. La suite reste verte.

Si la demande concerne un BUG : écris d'abord un test qui reproduit le bug (rouge), corrige (vert), vérifie l'absence de régression.

Règles :
- Un test = un comportement. Pas d'implémentation interne testée.
- Couvre cas nominal, cas limite, entrée invalide.
- Ne modifie jamais un test pour le faire passer au lieu de corriger le code.
- Ne valide jamais « ça marche » sans une sortie de test lue dans cette session.

Termine par :

## TDD — [fonctionnalité/bug]

### Comportement
[Une phrase testable]

### Tests écrits
- `test_...` : [ce qu'il vérifie]

### Preuves
- RED : `[commande]` → [sortie : échec attendu]
- GREEN : `[commande]` → [sortie : pass]
- Suite complète : `[commande]` → [sortie]
"""
